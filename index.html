<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kharcha</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f0f13; --surface: #18181f; --surface2: #22222c; --border: #2e2e3a;
    --accent: #7c6af7; --green: #4ade80; --red: #f87171; --text: #f0f0f5; --muted: #8888a0;
    --font-head: 'Syne', sans-serif; --font-body: 'DM Sans', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); min-height: 100vh; padding: 0; }
  body::before { content: ''; position: fixed; inset: 0; background-image: linear-gradient(rgba(124,106,247,0.04) 1px, transparent 1px), linear-gradient(90deg, rgba(124,106,247,0.04) 1px, transparent 1px); background-size: 40px 40px; pointer-events: none; z-index: 0; }
  .app { position: relative; z-index: 1; max-width: 900px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2.5rem; }
  .logo { font-family: var(--font-head); font-size: 1.4rem; font-weight: 700; letter-spacing: -0.02em; }
  .logo span { color: var(--accent); }
  .month-badge { font-size: 0.75rem; background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 20px; }
  .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin-bottom: 2rem; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.2rem 1.4rem; transition: border-color 0.2s; }
  .card:hover { border-color: var(--accent); }
  .card-label { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
  .card-amount { font-family: var(--font-head); font-size: 1.6rem; font-weight: 700; }
  .card-amount.income { color: var(--green); } .card-amount.expense { color: var(--red); } .card-amount.balance { color: var(--text); }
  .card-sub { font-size: 0.72rem; color: var(--muted); margin-top: 4px; }
  .main { display: grid; grid-template-columns: 1fr 340px; gap: 16px; align-items: start; }
  .form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; margin-bottom: 16px; }
  .form-title { font-family: var(--font-head); font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; color: var(--text); }
  .type-toggle { display: flex; gap: 8px; margin-bottom: 1rem; }
  .type-btn { flex: 1; padding: 8px; border-radius: 10px; border: 1px solid var(--border); background: transparent; color: var(--muted); font-family: var(--font-body); font-size: 0.8rem; font-weight: 500; cursor: pointer; transition: all 0.2s; }
  .type-btn.active-expense { background: rgba(248,113,113,0.15); border-color: var(--red); color: var(--red); }
  .type-btn.active-income { background: rgba(74,222,128,0.15); border-color: var(--green); color: var(--green); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field.full { grid-column: 1 / -1; }
  label { font-size: 0.7rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
  input, select { background: var(--surface2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-family: var(--font-body); font-size: 0.875rem; outline: none; transition: border-color 0.2s; width: 100%; }
  input:focus, select:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }
  select option { background: var(--surface2); }
  .add-btn { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: var(--font-head); font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: opacity 0.2s, transform 0.1s; }
  .add-btn:hover { opacity: 0.9; } .add-btn:active { transform: scale(0.98); }
  .transactions-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; }
  .list-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .list-title { font-family: var(--font-head); font-size: 0.95rem; font-weight: 600; }
  .filter-select { background: var(--surface2); border: 1px solid var(--border); color: var(--muted); padding: 5px 10px; border-radius: 8px; font-size: 0.75rem; font-family: var(--font-body); outline: none; cursor: pointer; }
  .tx-list { display: flex; flex-direction: column; gap: 8px; max-height: 340px; overflow-y: auto; padding-right: 4px; }
  .tx-list::-webkit-scrollbar { width: 4px; } .tx-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .tx-item { display: flex; align-items: center; justify-content: space-between; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }
  .tx-left { display: flex; align-items: center; gap: 10px; }
  .tx-icon { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 1rem; flex-shrink: 0; }
  .tx-name { font-size: 0.85rem; font-weight: 500; color: var(--text); }
  .tx-meta { font-size: 0.7rem; color: var(--muted); margin-top: 2px; }
  .tx-right { display: flex; align-items: center; gap: 10px; }
  .tx-amount { font-family: var(--font-head); font-size: 0.95rem; font-weight: 700; }
  .tx-amount.inc { color: var(--green); } .tx-amount.exp { color: var(--red); }
  .del-btn { width: 24px; height: 24px; border-radius: 6px; background: transparent; border: 1px solid transparent; color: var(--muted); cursor: pointer; font-size: 0.8rem; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
  .del-btn:hover { background: rgba(248,113,113,0.15); border-color: var(--red); color: var(--red); }
  .empty-state { text-align: center; padding: 2rem 1rem; color: var(--muted); font-size: 0.85rem; }
  .right-col { display: flex; flex-direction: column; gap: 16px; }
  .chart-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; }
  .chart-title { font-family: var(--font-head); font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
  .donut-wrap { position: relative; width: 140px; height: 140px; margin: 0 auto 1rem; }
  .donut-wrap svg { transform: rotate(-90deg); }
  .donut-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .donut-pct { font-family: var(--font-head); font-size: 1.3rem; font-weight: 700; }
  .donut-sub { font-size: 0.65rem; color: var(--muted); }
  .legend { display: flex; flex-direction: column; gap: 8px; }
  .legend-item { display: flex; align-items: center; justify-content: space-between; font-size: 0.78rem; }
  .legend-dot { width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; flex-shrink: 0; }
  .legend-name { display: flex; align-items: center; color: var(--muted); }
  .legend-val { font-weight: 500; color: var(--text); font-family: var(--font-head); font-size: 0.82rem; }
  .bar-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.4rem; }
  .bar-title { font-family: var(--font-head); font-size: 0.95rem; font-weight: 600; margin-bottom: 1rem; }
  .bar-list { display: flex; flex-direction: column; gap: 10px; }
  .bar-row { display: flex; flex-direction: column; gap: 4px; }
  .bar-meta { display: flex; justify-content: space-between; font-size: 0.72rem; }
  .bar-cat { color: var(--muted); } .bar-val { font-weight: 500; color: var(--text); }
  .bar-track { height: 6px; background: var(--surface2); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s ease; }
  @media (max-width: 640px) { .summary { grid-template-columns: 1fr; } .main { grid-template-columns: 1fr; } .form-grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="logo">khar<span>cha</span></div>
    <div class="month-badge" id="monthBadge"></div>
  </header>
  <div class="summary">
    <div class="card"><div class="card-label">Balance</div><div class="card-amount balance" id="balance">₹0</div><div class="card-sub">Net total</div></div>
    <div class="card"><div class="card-label">Income</div><div class="card-amount income" id="totalIncome">₹0</div><div class="card-sub" id="incomeCount">0 entries</div></div>
    <div class="card"><div class="card-label">Expenses</div><div class="card-amount expense" id="totalExpense">₹0</div><div class="card-sub" id="expenseCount">0 entries</div></div>
  </div>
  <div class="main">
    <div class="left-col">
      <div class="form-card">
        <div class="form-title">Add transaction</div>
        <div class="type-toggle">
          <button class="type-btn active-expense" id="btnExpense" onclick="setType('expense')">Expense</button>
          <button class="type-btn" id="btnIncome" onclick="setType('income')">Income</button>
        </div>
        <div class="form-grid">
          <div class="form-field full"><label>Description</label><input type="text" id="desc" placeholder="e.g. Lunch, Salary…"></div>
          <div class="form-field"><label>Amount (₹)</label><input type="number" id="amount" placeholder="0" min="0"></div>
          <div class="form-field"><label>Category</label>
            <select id="category">
              <option value="">Select…</option>
              <option>Food</option><option>Transport</option><option>Shopping</option>
              <option>Entertainment</option><option>Bills</option><option>Health</option>
              <option>Education</option><option>Salary</option><option>Freelance</option><option>Other</option>
            </select>
          </div>
          <div class="form-field"><label>Date</label><input type="date" id="date"></div>
        </div>
        <button class="add-btn" onclick="addTransaction()">+ Add Transaction</button>
      </div>
      <div class="transactions-card">
        <div class="list-header">
          <div class="list-title">Transactions</div>
          <select class="filter-select" id="filterCat" onchange="renderList()">
            <option value="">All categories</option>
            <option>Food</option><option>Transport</option><option>Shopping</option>
            <option>Entertainment</option><option>Bills</option><option>Health</option>
            <option>Education</option><option>Salary</option><option>Freelance</option><option>Other</option>
          </select>
        </div>
        <div class="tx-list" id="txList"></div>
      </div>
    </div>
    <div class="right-col">
      <div class="chart-card">
        <div class="chart-title">Expense breakdown</div>
        <div class="donut-wrap">
          <svg width="140" height="140" viewBox="0 0 140 140">
            <circle cx="70" cy="70" r="54" fill="none" stroke="#22222c" stroke-width="16"/>
            <circle id="donutIncome" cx="70" cy="70" r="54" fill="none" stroke="#4ade80" stroke-width="16" stroke-dasharray="0 339.3" stroke-linecap="round"/>
            <circle id="donutExpense" cx="70" cy="70" r="54" fill="none" stroke="#f87171" stroke-width="16" stroke-dasharray="0 339.3" stroke-linecap="round"/>
          </svg>
          <div class="donut-center"><div class="donut-pct" id="donutPct">0%</div><div class="donut-sub">spent</div></div>
        </div>
        <div class="legend">
          <div class="legend-item"><div class="legend-name"><div class="legend-dot" style="background:var(--green)"></div>Income</div><div class="legend-val" id="legendIncome">₹0</div></div>
          <div class="legend-item"><div class="legend-name"><div class="legend-dot" style="background:var(--red)"></div>Expenses</div><div class="legend-val" id="legendExpense">₹0</div></div>
        </div>
      </div>
      <div class="bar-card">
        <div class="bar-title">Top categories</div>
        <div class="bar-list" id="barList"><div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:1rem 0">No expenses yet</div></div>
      </div>
    </div>
  </div>
</div>
<script>
const CIRC = 2 * Math.PI * 54;
const ICONS = { Food:'🍱', Transport:'🚌', Shopping:'🛍️', Entertainment:'🎮', Bills:'💡', Health:'💊', Education:'📚', Salary:'💰', Freelance:'💻', Other:'📌', '':'📌' };
const CAT_COLORS = ['#7c6af7','#f7c06a','#4ade80','#f87171','#60a5fa','#fb923c','#a78bfa','#34d399'];
let txType = 'expense';
let transactions = JSON.parse(localStorage.getItem('kharcha_txns') || '[]');
function setType(t) { txType = t; document.getElementById('btnExpense').className = 'type-btn' + (t==='expense' ? ' active-expense' : ''); document.getElementById('btnIncome').className = 'type-btn' + (t==='income' ? ' active-income' : ''); }
function fmt(n) { return '₹' + Math.abs(n).toLocaleString('en-IN', {minimumFractionDigits:0,maximumFractionDigits:0}); }
function addTransaction() {
  const desc = document.getElementById('desc').value.trim();
  const amount = parseFloat(document.getElementById('amount').value);
  const category = document.getElementById('category').value || 'Other';
  const date = document.getElementById('date').value || new Date().toISOString().split('T')[0];
  if (!desc) { document.getElementById('desc').focus(); return; }
  if (!amount || amount <= 0) { document.getElementById('amount').focus(); return; }
  transactions.unshift({ id: Date.now(), desc, amount, category, date, type: txType });
  save();
  document.getElementById('desc').value = '';
  document.getElementById('amount').value = '';
  document.getElementById('category').value = '';
  renderAll();
}
function deleteTransaction(id) { transactions = transactions.filter(t => t.id !== id); save(); renderAll(); }
function save() { localStorage.setItem('kharcha_txns', JSON.stringify(transactions)); }
function renderAll() { renderSummary(); renderList(); renderDonut(); renderBars(); }
function renderSummary() {
  const income = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  document.getElementById('balance').textContent = fmt(income-expense);
  document.getElementById('totalIncome').textContent = fmt(income);
  document.getElementById('totalExpense').textContent = fmt(expense);
  const ic = transactions.filter(t=>t.type==='income').length;
  const ec = transactions.filter(t=>t.type==='expense').length;
  document.getElementById('incomeCount').textContent = ic+' entr'+(ic===1?'y':'ies');
  document.getElementById('expenseCount').textContent = ec+' entr'+(ec===1?'y':'ies');
}
function renderList() {
  const filter = document.getElementById('filterCat').value;
  const list = filter ? transactions.filter(t=>t.category===filter) : transactions;
  const el = document.getElementById('txList');
  if (!list.length) { el.innerHTML = '<div class="empty-state">📭<br>No transactions yet</div>'; return; }
  el.innerHTML = list.map(t => {
    const dateStr = new Date(t.date).toLocaleDateString('en-IN',{day:'numeric',month:'short'});
    return `<div class="tx-item"><div class="tx-left"><div class="tx-icon" style="background:${t.type==='income'?'rgba(74,222,128,0.15)':'rgba(248,113,113,0.12)'}">${ICONS[t.category]||'📌'}</div><div><div class="tx-name">${t.desc}</div><div class="tx-meta">${t.category} · ${dateStr}</div></div></div><div class="tx-right"><div class="tx-amount ${t.type==='income'?'inc':'exp'}">${t.type==='income'?'+':'-'}${fmt(t.amount)}</div><button class="del-btn" onclick="deleteTransaction(${t.id})">✕</button></div></div>`;
  }).join('');
}
function renderDonut() {
  const income = transactions.filter(t=>t.type==='income').reduce((s,t)=>s+t.amount,0);
  const expense = transactions.filter(t=>t.type==='expense').reduce((s,t)=>s+t.amount,0);
  const total = income+expense||1;
  const incArc=(income/total)*CIRC, expArc=(expense/total)*CIRC;
  document.getElementById('donutIncome').setAttribute('stroke-dasharray',`${incArc} ${CIRC-incArc}`);
  document.getElementById('donutExpense').setAttribute('stroke-dasharray',`${expArc} ${CIRC-expArc}`);
  document.getElementById('donutExpense').setAttribute('stroke-dashoffset',-incArc);
  document.getElementById('donutPct').textContent=(income>0?Math.round((expense/income)*100):0)+'%';
  document.getElementById('legendIncome').textContent=fmt(income);
  document.getElementById('legendExpense').textContent=fmt(expense);
}
function renderBars() {
  const catTotals={};
  transactions.filter(t=>t.type==='expense').forEach(t=>{catTotals[t.category]=(catTotals[t.category]||0)+t.amount;});
  const sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const el=document.getElementById('barList');
  if(!sorted.length){el.innerHTML='<div style="color:var(--muted);font-size:0.8rem;text-align:center;padding:1rem 0">No expenses yet</div>';return;}
  const max=sorted[0][1];
  el.innerHTML=sorted.map(([cat,val],i)=>`<div class="bar-row"><div class="bar-meta"><span class="bar-cat">${ICONS[cat]||'📌'} ${cat}</span><span class="bar-val">${fmt(val)}</span></div><div class="bar-track"><div class="bar-fill" style="width:${Math.round((val/max)*100)}%;background:${CAT_COLORS[i%CAT_COLORS.length]}"></div></div></div>`).join('');
}
document.getElementById('date').value=new Date().toISOString().split('T')[0];
document.getElementById('monthBadge').textContent=new Date().toLocaleDateString('en-IN',{month:'long',year:'numeric'});
renderAll();
</script>
</body>
</html>
